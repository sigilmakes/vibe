when:
  - event: push
    branch: [main]
  - event: pull_request
    branch: ["**"]
  - event: manual

engine: microvm
image: nixos
dependencies: [git, zstd]

environment:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_HOME: ".cargo"
  NIX_CONFIG: "experimental-features = nix-command flakes"
  RUST_BACKTRACE: "1"

cache:
  - key: vibe-cargo
    hash: [Cargo.lock, flake.lock]
    fallback: true
    paths: [".cargo", "target"]

substituters:
  https://cache.nixos.org: "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="

steps:
  - name: "Flake check"
    command: nix flake check --no-build

  - name: "Nix build"
    command: nix build .#default --no-link --max-jobs 1 --cores 2

  - name: "Format"
    command: nix develop --command cargo fmt --check

  - name: "Clippy"
    command: nix develop --command cargo clippy --all-targets --locked -- -D warnings

  - name: "Tests"
    command: nix develop --command cargo test --all-targets --locked
