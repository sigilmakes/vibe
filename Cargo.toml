[package]
name = "vibe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A colourful, audio-reactive terminal playground"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rustfft = "6"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
